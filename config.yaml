# Config manifest — entry point for the app's bundled configuration.
#
# Each top-level section lives in its own file under `config/`. This manifest
# lists those files; the config module (src/modules/config/) loads each one at
# build time and shallow-merges them into a single AppConfig. The top-level
# sections are disjoint, so the order below only documents intent.
#
# To add or remove a section, edit the matching file under `config/` and keep
# this list in sync.
include:
  - config/parameters.yaml
  - config/data.yaml          # data sources + preprocessing (mutations & joins)
  - config/template.yaml
  - config/data_protection.yaml
  - config/export.yaml
  - config/charts.yaml
