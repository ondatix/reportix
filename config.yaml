parameters:
  # — Standalone parameters (template variables, not bound to config leaves) —
  # `label` may be a plain string (same in every language) or a per-locale
  # map like `{ de: "Titel", en: "Title" }`. The active language selects the
  # entry; config is re-parsed when the user switches languages.
  title:
    label:
      de: "Titel"
      en: "Title"
    type: text
    default: "Gleichstellungskonzept"
  office:
    label:
      de: "Behörde"
      en: "Authority"
    type: text
    default: "Staatsministerium für Familie, Arbeit und Soziales"
  # palette:
  #   label: "Chart color palette"
  #   type: select
  #   default: okabe-ito
  #   options:
  #     - okabe-ito   # Okabe & Ito / Wong (2011) — 8-colour standard
  #     - tol-bright  # Paul Tol — Bright (7)
  #     - tol-muted   # Paul Tol — Muted (9)
  #     - ibm         # IBM Design Language colourblind-safe (5)
  #     - grayscale   # Print-safe maximum-contrast fallback
  font:
    # Curated theme: maps to CSS stack + DOCX family + display name via the
    # fonts module; not a 1:1 string override, so it stays standalone.
    label:
      de: "Schriftart"
      en: "Font"
    type: select
    default: arial
    options:
      - verdana   # Screen-optimised sans, broad legibility
      - tahoma    # Compact accessible sans
      - arial     # Universal sans
      - georgia   # Accessible serif option

  # — Bound overrides — `bind:` points at a config leaf. The form prefills
  #   from that leaf; the user-entered value overrides the preset at runtime.
  #   Bound entries carry no `default:` (the bound leaf is the source of truth).
  palette:
    label:
      de: "Farbpalette des Diagramms"
      en: "Chart color palette"
    type: select
    bind: charts.palette
    options:
      - okabe-ito   # Okabe & Ito / Wong (2011) — 8-colour standard
      - tol-bright  # Paul Tol — Bright (7)
      - tol-muted   # Paul Tol — Muted (9)
      - ibm         # IBM Design Language colourblind-safe (5)
      - grayscale   # Print-safe maximum-contrast fallback
  font_size:
    label:
      de: "Schriftgröße des Texts (pt)"
      en: "Body font size (pt)"
    type: number
    bind: export.font.size
  heading_color:
    label:
      de: "Überschriftenfarbe (Hex ohne #)"
      en: "Heading color (hex without #)"
    type: text
    bind: export.headings.color
  page_orientation:
    label:
      de: "Seitenausrichtung"
      en: "Page orientation"
    type: select
    bind: export.page.orientation
    options:
      - portrait
      - landscape
  header_text:
    label:
      de: "Kopfzeilentext"
      en: "Header text"
    type: text
    bind: export.header.text
  footer_text:
    label:
      de: "Fußzeilentext"
      en: "Footer text"
    type: text
    bind: export.footer.text
  page_numbers:
    # Rendered as page-icon radios (left | center | right | none); "none" hides
    # the footer page number. Values are translation-free; captions localized.
    label:
      de: "Seitenzahlen"
      en: "Page numbers"
    type: select
    bind: export.pageNumbers.position
    options:
      - left
      - center
      - right
      - none
  filename:
    label:
      de: "Dateiname der Ausgabe"
      en: "Output filename"
    type: text
    bind: export.filename
  # locale:
  #   label: "Locale"
  #   type: text
  #   bind: export.locale
  doc_subject:
    label:
      de: "Dokumentbetreff"
      en: "Document subject"
    type: text
    bind: export.document.subject
  doc_creator:
    label:
      de: "Dokumentersteller"
      en: "Document creator"
    type: text
    bind: export.document.creator
  smallest_group:
    label:
      de: "Schwellenwert kleinste Gruppe"
      en: "Smallest group threshold"
    type: number
    bind: dataProtection.smallestGroup
  section_numbering:
    label:
      de: "Überschriften nummerieren (1., 1.1., …)"
      en: "Number headings (1., 1.1., …)"
    type: boolean
    bind: export.sectionNumbering
  toc:
    label:
      de: "Inhaltsverzeichnis einfügen"
      en: "Include table of contents"
    type: boolean
    bind: export.toc

data:
  Gleichstellungsdatensatz:
    sheets:
      - sheet: Stichtag
        columns:
          - PersNr
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE
          - Einstiegs-QE
          - Teilzeit / Vollzeit
          - Arbeitszeitanteil
          - Führungsebene
          - Organisationseinheit
          - Ausbildungsbereich
          - Führung in Tandem
          - Führungskraft (aktiv)
          - Aktuellestes vorliegendes Ergebnis periodischer dienstlicher Beurteilung
          - Ab- oder Anwesenheitsart
          - Befristet / Unbefristet
      - sheet: Zeitraum_Beurlaubung
        columns:
          - PersNr
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE
          - Arbeitszeitmodell
          - Führungsebene
          - Dauer der Elternzeit (Tage)
      - sheet: Zeitraum_Bewerbung
        columns:
          - BewerberID
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE
          - Führungsebene
          - Intern / Extern
          - Organisationseinheit
      - sheet: Zeitraum_Einstellung
        columns:
          - PersNr
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE			
      - sheet: Zeitraum_Fortbildung
        columns:
          - PersNr
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE
      - sheet: Zeitraum_Qualifikation
        columns:
          - PersNr
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE
          - Arbeitszeitmodell
          - Qualifikationsart	
      - sheet: Zeitraum_Leistungskomponente
        columns:
          - PersNr
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE
          - Arbeitszeitmodell
          - Führungsebene
          - Höhe Leistungskomponente (LK = Leistungsprämien/-entgelt, LOB) 
      - sheet: Zeitraum_Befoerderung
        columns:
          - PersNr
          - Geschlecht
          - Entgeltgruppe / Besoldungsgruppe
          - QE
          - Arbeitszeitmodell
          - Führungsebene
          - Maßnahmenantrag
          - Maßnahmenart

template:
  # Step 2 shows a radio chooser of the entries below. `file` is the filename
  # within the bundled `templates/` directory; `label` is what the user sees.
  # The app hard-fails at startup if any referenced file isn't bundled.
  files:
    - label:
        de: "Gleichstellungskonzept (vollständig)"
        en: "Equality concept (full)"
      file: template_full.md
    - label:
        de: "Gleichstellungskonzept (verpflichtend)"
        en: "Equality concept (mandatory)"
      file: template_mandatory.md

data_protection:
  smallest_group: 5  # bound by parameters.smallest_group

export:
  filename: report.docx        # bound by parameters.filename
  locale: de-DE                # bound by parameters.locale
  section_numbering: false     # bound by parameters.section_numbering
  toc: false                   # bound by parameters.toc

  document:
    title: Report
    subject: ""                # bound by parameters.doc_subject
    creator: ""                # bound by parameters.doc_creator
    description: ""
    keywords: ""

  font:
    family: Arial              # overridden at runtime by the `font` parameter
    size: 11                   # bound by parameters.font_size
    heading_family: Arial      # overridden at runtime by the `font` parameter
    color: "1A1A1A"

  headings:
    color: "1F3864"            # bound by parameters.heading_color
    h1_size: 20                # pt
    h2_size: 16
    h3_size: 13
    h4_size: 12

  paragraph:
    alignment: left            # left | center | right | justify
    spacing_before: 0          # twips
    spacing_after: 120         # twips (~6 pt)
    line_spacing: 276          # twips (276 ≈ single at 11 pt)

  page:
    orientation: portrait      # bound by parameters.page_orientation
    # A4 in twips (1 mm ≈ 56.7 twips); remove to use orientation defaults
    width: 11906
    height: 16838
    margin:
      top: 1418                # ~25 mm
      right: 1418
      bottom: 1418
      left: 1418
      header: 709              # ~12 mm from top edge to header
      footer: 709              # ~12 mm from bottom edge to footer

  page_numbers:
    position: center           # left | center | right | none — bound by parameters.page_numbers
    start: 1
    format: decimal            # decimal | upperRoman | lowerRoman | upperLetter | lowerLetter

  header:
    text: ""                   # bound by parameters.header_text

  footer:
    text: ""                   # bound by parameters.footer_text

  table:
    border_style: single       # single | double | dashed | dotted | thick | none
    border_color: "AAAAAA"     # hex without #
    border_size: 4             # eighths of a point
    cell_padding: 80           # twips (~1.5 mm)

  # Callout boxes — applies to DOCX export.
  # definition_box styles `::: {.callout-note} … :::` (used for Definitionen).
  # summary_box    styles `::: {.callout-tip}  … :::` (used for Fazit).
  # `color`      = accent (left border + title), 6-digit hex without #
  # `background` = true → pale tint derived from `color`; false → no fill
  definition_box:
    color: "1F77B4"            # blue accent
    background: true
  summary_box:
    color: "2CA02C"            # green accent
    background: true

charts:
  palette: okabe-ito           # bound by parameters.palette
  animation: false             # disable animation (recommended for reports)
  aspect_ratio: 2.0            # width:height ratio of every chart

  font:
    family: Arial              # overridden at runtime by the `font` parameter
    size: 12                   # pt
    color: "555555"            # hex without #; used for tick labels and legend

  title:
    position: top              # top | bottom | left | right
    align: center              # start | center | end
    color: "1A1A1A"            # hex without #

  legend:
    display: true
    position: top              # top | bottom | left | right
    align: center              # start | center | end

  tooltip:
    enabled: true

  scales:
    x:
      begin_at_zero: false
      grid_display: true
      grid_color: "rgba(0,0,0,0.08)"
      tick_color: "888888"     # hex without #
    y:
      begin_at_zero: true
      grid_display: true
      grid_color: "rgba(0,0,0,0.08)"
      tick_color: "888888"     # hex without #

  elements:
    line:
      tension: 0.0             # 0 = straight lines, ~0.4 = smooth curves
      point_radius: 3          # point marker size in px
    bar:
      border_radius: 0         # rounded bar corners in px
      bar_percentage: 0.9      # fraction of category slot used by bars (0–1)
