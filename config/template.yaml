template:
  # Step 2 shows a radio chooser of the entries below. `file` is the filename
  # within the bundled `templates/` directory; `label` is what the user sees.
  # The app hard-fails at startup if any referenced file isn't bundled.
  #
  # `id` is a stable, translation-free identifier referenced by the `include`
  # lists in data.yaml. When a template is selected, the data-loading step shows
  # only the sheets/columns whose `include` contains this id (or omit `include`
  # to include a sheet/column in every template).
  files:
    - id: full
      label:
        de: "Gleichstellungskonzept vollständig (empfohlen)"
        en: "Full equality concept (recommended)"
      file: template_full.md
    - id: mandatory
      label:
        de: "Gleichstellungskonzept minimal (verpflichtend)"
        en: "Minimal equality concept (mandatory)"
      file: template_mandatory.md

  # ── Question catalog ────────────────────────────────────────────────
  # Consumed ONLY by scripts/gen-templates.ts (the runtime config parser
  # ignores this key). A flat, ordered list rendered into the master's
  # `{{questions}}` placeholder; the `{{tables}}` placeholder in the appendix
  # receives one crosstab table per question, built from the same `table:`
  # spec and the same `caption:`.
  #
  # Two entry types, discriminated by their first key:
  #   - section: <heading>          # emits "### <heading>" + a Definitionen
  #     definitions: <markdown>     #   callout; a Fazit callout is appended
  #                                 #   automatically after the section's last
  #                                 #   question. Sections with no included
  #                                 #   question are skipped entirely.
  #   - title: <question>           # emits "#### <question>" + the parts below
  #     include: full               # template id(s); omit ⇒ every template
  #     comment: Optional           # italic status line under the heading
  #     datenquelle: PVS            # source line: "> Datenquelle: … ·
  #     personenkreis: Alle         #   Personenkreis: … · Datensatz: <table.data>"
  #     caption: "…"                # figure caption + appendix-table caption
  #     text: "…"                   # omit/null ⇒ default freetext placeholder
  #     table:                      # the wrangled crosstab both blocks share
  #       data: <dataset>           #   DataStore key (sheet or join output)
  #       filter: <column>          #   truthy-row filter; omit ⇒ all rows
  #       groupby:
  #         rows: <column>          #   table rows / chart categories
  #         cols: <column>          #   optional: table columns / chart series
  #       aggregation: count        #   count | sum | mean | min | max | median
  #                                 #   | share_total | share_group
  #       value: <column>           #   required by sum/mean/min/max/median/share_group
  #       format: currency          #   optional cell format (integer|decimal|percent|currency)
  #     chart:                      # presentation only
  #       type: bar                 #   bar | line | pie | doughnut | pyramid | distance
  #       stacked: true             #   bar/line: stack the series
  #       title: "…"
  questions:
    # ═══ Gesamtübersicht ═══
    # `definitions:` entries reference the column/mutation/sheet definitions in
    # data.yaml (single source of truth). Entry forms:
    #   - <name>                       # term = data.yaml name
    #   - term: <shown>, ref: <name>   # displayed term differs from data.yaml name
    #   - term: <shown>, text: <text>  # verbatim — concept without data.yaml entry
    - section: Gesamtübersicht
      definitions:
        - Ausbildungsbereich
        - "Beamte / Tarifbeschäftigte"
        - "Befristet / Unbefristet"
        - Einstiegs-QE
        - "Entgeltgruppe / Besoldungsgruppe"
        - Geschlecht
        - Organisationseinheit
        - QE

    - title: "Wie viele Männer und Frauen arbeiten bei uns?"
      datenquelle: PVS
      personenkreis: Alle
      caption: "Verteilung der Beschäftigten nach Geschlecht (Anteile in Prozent)."
      table:
        data: Stichtag
        groupby:
          rows: Geschlecht
        aggregation: share_total
      chart:
        type: pie
        title: Geschlechterverteilung

    - title: "Wie viele Männer und Frauen arbeiten in den Organisationseinheiten?"
      comment: "Verpflichtend für Kommunen ab 1.000 Beschäftigten"
      datenquelle: PVS
      personenkreis: Alle
      caption: "Anzahl der Frauen und Männer je Organisationseinheit."
      table:
        data: Stichtag
        groupby:
          rows: Organisationseinheit
          cols: Geschlecht
        aggregation: count
      chart:
        type: distance
        title: Männer und Frauen in den Organisationseinheiten

    - title: "Wie viele Männer und Frauen sind Tarifbeschäftigte bzw. Beamte?"
      datenquelle: PVS
      personenkreis: Alle
      caption: "Anzahl der Frauen und Männer nach Beamten- bzw. Tarifstatus."
      table:
        data: Stichtag
        groupby:
          rows: "Beamte / Tarifbeschäftigte"
          cols: Geschlecht
        aggregation: count
      chart:
        type: bar
        stacked: true
        title: Tarifbeschäftigte vs. Beamte

    - title: "Wie viele Männer und Frauen haben befristete (Zeitverträge) bzw. unbefristete Arbeitsverhältnisse?"
      include: full
      comment: Optional
      datenquelle: PVS
      personenkreis: Tarifbeschäftigte
      caption: "Anzahl befristeter und unbefristeter Arbeitsverhältnisse nach Geschlecht (Tarifbeschäftigte)."
      table:
        data: Stichtag
        filter: Tarifbeschäftigte
        groupby:
          rows: "Befristet / Unbefristet"
          cols: Geschlecht
        aggregation: count
      chart:
        type: bar
        stacked: true
        title: Befristete vs. unbefristete Arbeitsverhältnisse

    - title: "Wie viele Männer und Frauen sind in den Entgelt-/Besoldungsgruppen?"
      datenquelle: PVS
      personenkreis: Alle
      caption: "Anzahl der Frauen und Männer je Entgelt- bzw. Besoldungsgruppe."
      table:
        data: Stichtag
        groupby:
          rows: "Entgeltgruppe / Besoldungsgruppe"
          cols: Geschlecht
        aggregation: count
      chart:
        type: distance
        title: Männer und Frauen in den Entgelt- und Besoldungsgruppen

    - title: "Wie viele Männer und Frauen sind in welcher Qualifikationsebene (bzw. QE-Äquivalent)?"
      datenquelle: PVS
      personenkreis: Alle
      caption: "Anzahl der Frauen und Männer je Qualifikationsebene."
      table:
        data: Stichtag
        groupby:
          rows: QE
          cols: Geschlecht
        aggregation: count
      chart:
        type: pyramid
        title: Qualifikationsebenen nach Geschlecht

    # TODO(data): Spalte "QE-Aufstieg" existiert nicht und ist mit den aktuellen
    # Mutations-Operatoren (einspaltige if-else-Regel) nicht ableitbar — sie
    # bräuchte den Vergleich QE vs. Einstiegs-QE.
    - title: "Wie viele Männer und Frauen sind in welcher QE verglichen zur Einstiegs-QE?"
      include: full
      comment: Optional
      datenquelle: PVS
      personenkreis: Alle
      caption: "Anzahl der Frauen und Männer nach QE-Aufstieg im Vergleich zur Einstiegs-QE."
      table:
        data: Stichtag
        groupby:
          rows: QE-Aufstieg
          cols: Geschlecht
        aggregation: count
      chart:
        type: pyramid
        title: QE-Aufstieg im Vergleich zur Einstiegs-QE

    # TODO(data): Filterspalte "Auszubildende" existiert in keinem Blatt —
    # Filter ist derzeit ein stiller No-op.
    - title: "Wie viele Männer und Frauen sind Auszubildende?"
      comment: "Verpflichtend für Dienststellen ab 40 Auszubildenden"
      datenquelle: PVS
      personenkreis: Auszubildende
      caption: "Anzahl der Auszubildenden nach Ausbildungsbereich und Geschlecht."
      table:
        data: Stichtag
        filter: Auszubildende
        groupby:
          rows: Ausbildungsbereich
          cols: Geschlecht
        aggregation: count
      chart:
        type: bar
        title: Auszubildende in den Ausbildungsbereichen

    # ═══ Bewerbungen und Einstellungen ═══
    - section: Bewerbungen und Einstellungen
      definitions:
        - term: Einstellungen
          ref: Zeitraum_Einstellung   # sheet definition
        - term: Qualifizierte Bewerbung
          text: "Als qualifizierte Bewerbungen gelten Bewerbungen auf ausgeschriebene Stellen, die die fachlichen Anforderungen erfüllen, sowie Initiativbewerbungen, die die fachlichen Anforderungen für eine aktuell offene Stelle erfüllen."

    # TODO(data): Filterspalte "Qualifizierte Bewerbungen" existiert nicht in
    # Zeitraum_Bewerbung — Filter ist derzeit ein stiller No-op (gilt für die
    # vier Bewerbungs-Fragen).
    - title: "Wie viele qualifizierte Bewerbungen gehen je QE ein?"
      include: full
      comment: Optional
      datenquelle: "Bewerbungsmanagement-Software, Eigene Liste"
      personenkreis: Qualifizierte Bewerbungen
      caption: "Anzahl qualifizierter Bewerbungen je Qualifikationsebene und Geschlecht."
      table:
        data: Zeitraum_Bewerbung
        filter: Qualifizierte Bewerbungen
        groupby:
          rows: QE
          cols: Geschlecht
        aggregation: count
      chart:
        type: pyramid
        title: Qualifizierte Bewerbungen nach Qualifikationsebene

    - title: "Wie viele qualifizierte Bewerbungen gehen je Führungsebene ein?"
