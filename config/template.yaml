    # ═══ Beurlaubung ═══
    - section: Beurlaubung
      definitions:
        # Konzeptdefinitionen ohne data.yaml-Spalte → Text inline.
        - term: "Beginn der Elternzeit im Zeitraum 01.01. - 31.12. des vorangegangenen Kalenderjahres"
          text: |
            Erfasst wird das Beginndatum jeder Elternzeit, die für eine Person im Kalenderjahr X besteht. Hat die Elternzeit bereits am 01.01._X_ oder früher begonnen, wird als Beginn der 01.01._X_ angegeben.
            Für Personen, die im Jahr _X_ mehrere Elternzeiten angetreten haben, wird für jede Elternzeit ein separater Dateneintrag erstellt.
        - term: Beurlaubung aus familiären Gründen
          text: "Gibt an, ob sich die Person zum Stichtag entweder in Elternzeit (ohne Elternteilzeit) oder in familienpolitischer Beurlaubung befindet."
        - term: "Ende der Elternzeit im Zeitraum 01.01. - 31.12. des vorangegangenen Kalenderjahres"
          text: |
            Erfasst wird das Enddatum jeder Elternzeit, die für eine Person im Kalenderjahr _X_ besteht. Endet die Elternzeit erst am 31.12._X_ oder später, wird als Ende der 31.12._X_ angegeben.

            Für Personen, die im Jahr _X_ mehrere Elternzeiten hatten, wird für jede Elternzeit ein separater Dateneintrag erstellt.

    # TODO(data): Spalte "Beurlaubung" existiert nicht auf Stichtag — sie müsste
    # z. B. per Mutation aus "Ab- oder Anwesenheitsart" abgeleitet werden (die
    # dafür nötigen Ausprägungen sind noch zu klären).
    - title: "Wie viele Männer und Frauen sind aus familiären Gründen beurlaubt?"
      datenquelle: PVS
