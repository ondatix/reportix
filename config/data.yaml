data:
  # Each sheet and each column may carry three optional metadata fields:
  #   definition   — human-readable definition of the sheet/column
  #   notes        — optional further notes
  #   include      — list of template ids (see template.yaml `id:`) this
  #                  sheet/column belongs to. OMITTED ⇒ included in every
  #                  template. To restrict, list the ids, e.g.
  #                    include: [full]            # only the full template
  #                    include: [full, mandatory] # both
  #                  The data-loading step shows only the sheets/columns whose
  #                  `include` matches the selected template.
  # A column may be written as a plain string (no metadata) or as an object
  # with `column:` (or `name:`) plus any of the fields above.
  #
  # Definitions are taken from the "Definitionen" callouts in
  # templates/template_full.md (authoritative wording). Columns without a
  # definition there carry a brief generic one; concept definitions that don't
  # map to a single column live in the sheet's `notes`.
  Gleichstellungsdatensatz:
    sheets:
      - sheet: Stichtag
        definition: "Stichtagsbezogener Personalstand — eine Zeile je Beschäftigtem zum Stichtag."
        columns:
          - column: PersNr
            definition: "Eindeutige Personalnummer; Schlüssel für die Joins mit den Zeitraum-Blättern."
          - column: Geschlecht
            definition: "Geschlecht der Person"
          - column: "Entgeltgruppe / Besoldungsgruppe"
            definition: "Gibt an, welcher Entgeltgruppe (für Tarifbeschäftigte) bzw. Besoldungsgruppe (für Beamtinnen bzw. Beamte) die Tätigkeit bzw. das Amt der Person zum Stichtag zugeordnet ist."
          - column: QE
            definition: "Gibt die derzeitige Qualifikationsebene (QE) bei Beamtinnen und Beamten an. Für Tarifbeschäftigte kann ein entsprechendes QE-Äquivalent ausgewiesen werden."
          - column: Einstiegs-QE
            definition: "Qualifikationsebene bei Einstellung"
          - column: "Teilzeit / Vollzeit"
            definition: "Gibt an, ob der festgelegte Arbeitszeitumfang der Person Vollzeit (100 %) oder Teilzeit (weniger als 100 %) beträgt."
          - column: Arbeitszeitanteil
            definition: "Einstufung des Arbeitszeitanteils in folgende Kategorien: bis unter 50 %; 50 % bis unter 90 %; 90 % bis unter 100 %; 100 % (entspricht den Normstunden bei Vollzeit)"
          - column: Führungsebene
            definition: "Führungsebenen klassifizieren Führungspositionen und leitende Funktionen nach dem Grad ihrer Entscheidungskompetenz sowie dem Umfang ihrer Verantwortlichkeiten."
          - column: Organisationseinheit
            definition: "Gibt an, in welcher Organisationseinheit (z. B. Abteilung, Referat, Amt) die betreffende Person zum Stichtag tätig ist."
          - column: Ausbildungsbereich
            definition: "Kategorisierung verschiedener Ausbildungsbereiche der Auszubildenden der Dienststelle"
          - column: Führungskraft (aktiv) in Tandem
            definition: "Gibt an, ob die Führungskraft ihre Führungs- bzw. Leitungsfunktion am Stichtag gemeinsam mit mindestens einer weiteren aktiven (d. h. nicht beurlaubten) Person ausübt."
          - column: Führungskraft (aktiv)
            definition: "Gibt an, ob die Person am Stichtag eine Führungsposition oder leitende Funktion aktiv ausübt."
          - column: Aktuellestes vorliegendes Ergebnis periodischer dienstlicher Beurteilung
            definition: "Das Ergebnis der zuletzt für die Person durchgeführten periodischen Beurteilung."
          - column: Ab- oder Anwesenheitsart
            definition: "Art der Ab- oder Anwesenheit."
          - column: "Befristet / Unbefristet"
            definition: "Gibt an, ob eine Person zum Stichtag befristet oder unbefristet beschäftigt ist."
      - sheet: Zeitraum_Beurlaubung
        definition: "Beurlaubungsereignisse im Berichtszeitraum. Personenstammdaten werden per Join mit Stichtag (PersNr) ergänzt."
        notes: >-
          Spalten, die bereits über den Stichtag-Join erreichbar sind, wurden hier bewusst entfernt (keine Doppelerfassung).
          Elternzeit: Beurlaubung nach Bundeselterngeld- und Elternzeitgesetz.
          Familienpolitische Beurlaubung: Beurlaubung aus familiären Gründen über Elternzeit hinaus.
        columns:
          - column: PersNr
            definition: "Personalnummer; Join-Schlüssel zu Stichtag."
          - column: Dauer der Elternzeit (Tage)
            definition: "Kalendertage zwischen Antritts- und Endedatum der Elternzeit."
      - sheet: Zeitraum_Bewerbung
        definition: "Bewerbungsereignisse im Berichtszeitraum. Eigener Schlüssel (BewerberID), daher kein Stichtag-Join — die benötigten Personenmerkmale stehen direkt im Blatt."
        notes: "Qualifizierte Bewerbung: Als qualifizierte Bewerbungen gelten Bewerbungen auf ausgeschriebene Stellen, die die fachlichen Anforderungen erfüllen, sowie Initiativbewerbungen, die die fachlichen Anforderungen für eine aktuell offene Stelle erfüllen."
        columns:  
          - column: BewerberID
            definition: "Eindeutige Bewerberkennung."
          - column: Geschlecht
            definition: "Im Datensatz wird zwischen den Ausprägungen unterschieden, die das Personalverwaltungssystem führt."
          - column: "Entgeltgruppe / Besoldungsgruppe"
            definition: "Gibt an, welcher Entgeltgruppe (für Tarifbeschäftigte) bzw. Besoldungsgruppe (für Beamtinnen bzw. Beamte) die Tätigkeit bzw. das Amt der Person zum Stichtag zugeordnet ist."
          - column: QE
            definition: "Gibt die derzeitige Qualifikationsebene (QE) bei Beamtinnen und Beamten an. Für Tarifbeschäftigte kann ein entsprechendes QE-Äquivalent ausgewiesen werden."
          - column: Führungsebene
            definition: "Führungsebenen klassifizieren Führungspositionen und leitende Funktionen nach dem Grad ihrer Entscheidungskompetenz sowie dem Umfang ihrer Verantwortlichkeiten."
          - column: "Intern / Extern"
            definition: "Internbewerbung aus der eigenen Dienststelle bzw. Bewerbung von außerhalb."
          - column: Organisationseinheit
            definition: "Referat / Sachgebiet / Amt — je nach Verwaltungsebene unterschiedlich tief gegliedert."
      - sheet: Zeitraum_Einstellung
        definition: "Einstellungen umfassen alle Personen, die neu von extern in die Organisation aufgenommen werden. Dazu zählen auch ehemalige Nachwuchskräfte (z. B. Referendarinnen und Referendare sowie Auszubildende), die nach Abschluss ihrer Ausbildung ein Beschäftigungsverhältnis in der Organisation eingehen. Berücksichtigt werden sowohl befristete als auch unbefristete Beschäftigungsverhältnisse. Abordnungen und Versetzungen aus anderen Ressorts (im Beamtenbereich) zählen nicht als Einstellungen. Saisonarbeitende sowie vergleichbare saisonale Beschäftigte bleiben ebenfalls unberücksichtigt."
        columns:
          - column: PersNr
            definition: "Personalnummer; Join-Schlüssel zu Stichtag."
      - sheet: Zeitraum_Fortbildung
        definition: "Fortbildungen im Berichtszeitraum — anlassbezogene Weiterbildungsmaßnahmen, nicht zwingend mit Abschluss. Personenstammdaten werden per Join mit Stichtag (PersNr) ergänzt."
        notes: "Doppelt vorgehaltene Stammdatenspalten wurden entfernt; sie stammen aus dem Stichtag-Join."
        columns:
          - column: PersNr
            definition: "Personalnummer; Join-Schlüssel zu Stichtag."
      - sheet: Zeitraum_Qualifikation
        definition: "Qualifizierungsereignisse im Berichtszeitraum. Personenstammdaten werden per Join mit Stichtag (PersNr) ergänzt."
        notes: >-
          Doppelt vorgehaltene Stammdatenspalten wurden entfernt; sie stammen aus dem Stichtag-Join.
          Bewilligt vs. abgeschlossen: Eine bewilligte Maßnahme kann noch offen sein; abgeschlossen heißt erfolgreich beendet.
        columns:
          - column: PersNr
            definition: "Personalnummer; Join-Schlüssel zu Stichtag."
          - column: Qualifikationsart
            definition: "Modulare Qualifizierung (MQ), Ausbildungsqualifizierung (AQ), Beförderung in höhere Laufbahn (BL) u. a."
      - sheet: Zeitraum_Leistungskomponente
        definition: "Leistungskomponenten (LK) im Berichtszeitraum — Sammelbegriff für Leistungsprämien, Leistungsentgelte und leistungsorientierte Bezahlung (LOB). Personenstammdaten werden per Join mit Stichtag (PersNr) ergänzt."
        notes: "Doppelt vorgehaltene Stammdatenspalten wurden entfernt; sie stammen aus dem Stichtag-Join."
        columns:
          - column: PersNr
            definition: "Personalnummer; Join-Schlüssel zu Stichtag."
          - column: "Höhe Leistungskomponente (LK = Leistungsprämien/-entgelt, LOB)"
            definition: "Erfasst wird die Summe aller im vorangegangenen Kalenderjahr zusätzlich zum Grundgehalt gezahlten leistungsabhängigen Zulagen und Prämien."
      - sheet: Zeitraum_Befoerderung
        definition: "Beförderungs-/Höhergruppierungsereignisse im Berichtszeitraum. Personenstammdaten (inkl. abgeleiteter Beamte/Tarifbeschäftigte-Klassifikation) werden per Join mit Stichtag (PersNr) ergänzt."
        notes: "Doppelt vorgehaltene Stammdatenspalten wurden entfernt; sie stammen aus dem Stichtag-Join."
        columns:
          - column: PersNr
            definition: "Personalnummer; Join-Schlüssel zu Stichtag."
          - column: Maßnahmenantrag
            definition: "Erfasst wird, ob eine Höhergruppierung auf Antrag oder automatisch erfolgt ist."
          - column: Maßnahmenart
            definition: "Art der Maßnahme; Grundlage der abgeleiteten Flags Beförderung (ja/nein) und Höhergruppierung genehmigt."

# Derived columns and datasets, built from the sheets above before rendering.
# Kept in this file because mutations/joins operate directly on the `data`
# sheets and share their context.
#   `mutations` (run first) add a column via a simple if-else rule, then
#   `joins` enrich one sheet with another's columns by a shared key.
# A mutation may carry an optional `definition` (metadata) describing the
# derived column, mirroring the column metadata above.
preprocessing:
  mutations:
    # Beamte/Tarifbeschäftigte aus der Entgelt-/Besoldungsgruppe ableiten:
    # Besoldungsgruppen (A…, B…, R…, W…) ⇒ Beamte; Entgeltgruppen (E…) ⇒ Tarif.
    # Auf Stichtag abgeleitet — der Join unten trägt sie nach Zeitraum_Befoerderung.
    - dataset: Stichtag
      column: Beamte
      definition: "Statusrechtliche Unterscheidung Beamte vs. Tarifbeschäftigte (separate Auswertung wegen unterschiedlicher Beurteilungssysteme); Ja für Besoldungsgruppen (A/B/R/W), abgeleitet aus der Entgelt-/Besoldungsgruppe."
      from: "Entgeltgruppe / Besoldungsgruppe"
      when:
        starts_with: [A, B, R, W]
      then: "Ja"
      else: "Nein"
    - dataset: Stichtag
      column: Tarifbeschäftigte
      definition: "Statusrechtliche Unterscheidung Beamte vs. Tarifbeschäftigte (separate Auswertung wegen unterschiedlicher Beurteilungssysteme); Ja für Entgeltgruppen (E), abgeleitet aus der Entgelt-/Besoldungsgruppe."
      from: "Entgeltgruppe / Besoldungsgruppe"
      when:
        starts_with: [E]
      then: "Ja"
      else: "Nein"
    # Kategoriale Variante der Statusunterscheidung — als Zeilen-/Spaltenachse
    # in den Auswertungen nutzbar (die booleschen Spalten oben dienen als Filter).
    - dataset: Stichtag
      column: "Beamte / Tarifbeschäftigte"
      definition: "Gibt an, ob eine Person zum Stichtag verbeamtet ist (Beamtinnen und Beamte) oder als Tarifbeschäftigte bzw. Tarifbeschäftigter nach TVöD bzw. TV-L beschäftigt wird."
      from: "Entgeltgruppe / Besoldungsgruppe"
      when:
        starts_with: [A, B, R, W]
      then: "Beamte"
      else: "Tarifbeschäftigte"
    # Beförderungsereignisse klassifizieren (eigene Spalten von Zeitraum_Befoerderung):
    - dataset: Zeitraum_Befoerderung
      column: "Beförderung (ja/nein)"
      definition: "Erfasst werden alle Beamtinnen und Beamten, die im Zeitraum mindestens eine Beförderung (d. h. eine Ernennung, durch die ein anderes Amt mit höherem Endgrundgehalt oder ein anderes Amt mit höherer Amtszulage verliehen wird) erhalten haben."
      from: Maßnahmenart
      when:
        equals: "Beförderung"
      then: "Ja"
      else: "Nein"
    - dataset: Zeitraum_Befoerderung
      column: "Höhergruppierung genehmigt"
      definition: "Erfasst werden alle Tarifbeschäftigten, bei denen im Zeitraum mindestens eine Höhergruppierung (d.h. die tarifrechtliche Zuordnung in eine höhere Entgeltgruppe) erfolgt ist."
      from: Maßnahmenart
      when:
        equals: "Höhergruppierung"
      then: "Ja"
      else: "Nein"

  # ── Joins: look up matching rows in `right` by key (first match wins — left
  #    rows are never duplicated) and copy its columns onto `left`. Setting
  #    `name` = `left` enriches the source in place, so the template's existing
  #    `data:` blocks pick up the added columns automatically. ──
  joins:
    # Beförderungsereignisse mit den Stammdaten der Person aus `Stichtag`
    # anreichern (Schlüssel: PersNr). Trägt u. a. die oben abgeleitete
    # Beamte/Tarifbeschäftigte-Klassifikation in Zeitraum_Befoerderung, die die
    # Beförderungs-Diagramme als `filter:` nutzen. `select` weggelassen → alle
    # Stichtag-Spalten, die in Zeitraum_Befoerderung noch nicht vorhanden sind.
    - name: Zeitraum_Befoerderung   # in-place enrichment of the source sheet
      left: Zeitraum_Befoerderung
      right: Stichtag
      on: PersNr
      type: left
    - name: Zeitraum_Beurlaubung
      left: Zeitraum_Beurlaubung
      right: Stichtag
      on: PersNr
      type: left
    - name: Zeitraum_Einstellung
      left: Zeitraum_Einstellung
      right: Stichtag
      on: PersNr
      type: left
    - name: Zeitraum_Fortbildung
      left: Zeitraum_Fortbildung
      right: Stichtag
      on: PersNr
      type: left
    - name: Zeitraum_Qualifikation
      left: Zeitraum_Qualifikation
      right: Stichtag
      on: PersNr
      type: left
    - name: Zeitraum_Leistungskomponente
      left: Zeitraum_Leistungskomponente
      right: Stichtag
      on: PersNr
      type: left
