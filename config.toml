[parameters]
  [parameters.period]
  label   = "Reporting period"
  type    = "text"
  default = "Q1 2026"

  [parameters.department]
  label   = "Department"
  type    = "select"
  options = ["Sales", "Engineering", "Marketing"]

[data]
  [data.gleichstellung]
  [[data.gleichstellung.sheets]]
  sheet   = "Stichtag"
  columns = ["PersNr", "Geschlecht"]

[template]
file = "report_template.md"

[export]
filename = "report.docx"
locale   = "de-DE"

  [export.font]
  family          = "Arial"
  size            = 11
  heading_family  = "Arial"

  [export.page]
  # A4 in twips (1 mm ≈ 56.7 twips)
  width  = 11906
  height = 16838

    [export.page.margin]
    top    = 1417
    right  = 1417
    bottom = 1417
    left   = 1417
