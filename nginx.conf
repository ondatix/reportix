server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Static client-side app: serve the file if it exists, otherwise fall
    # back to index.html so deep links resolve to the single-page entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Quarto handbuch served as a sub-path. Its own fallback keeps the webapp's
    # /index.html SPA fallback from swallowing handbuch URLs.
    location /handbuch/ {
        try_files $uri $uri/ /handbuch/index.html;
    }
}
