project:
  type: book
  # Match the container plumbing (Dockerfile copies handbuch/_site → nginx
  # /handbuch). Quarto books default to _book/.
  output-dir: _site
  # Locally-bundled Funnel Sans (referenced by styles.scss via url(fonts/…));
  resources:
    - fonts/

# Cache computational (R) output so the deploy build renders with the Quarto
# CLI alone — no R. Execute locally to (re)populate handbuch/_freeze/, commit
# it, and CI/Docker reuses it.
execute:
  freeze: auto

book:
  title: "reportix Handbuch"
  date: last-modified
  chapters:
    - index.qmd
    - quick-start.qmd
    - part: "Handbuch"
      chapters: 
        - musterkonzept.qmd
        - datenvorbereitung.qmd
        - webapp.qmd
        - nachbereitung.qmd
        - datenschutz.qmd
    - noch-fragen.qmd
    - ueber-reportix.qmd
  page-footer:
    center: 
      - text: "Impressum"
        href: impressum.qmd
  favicon: images/ondatix_Bildmarke_dunkler_Hintergrund_PNG.png
  navbar: 
    background: white
    logo: images/ondatix_Logo_V1_heller_Hintergrund_PNG.png

lang: de

format:
  html:
    from: markdown+smart
    theme:
      - cosmo       # 1. Basis Bootstrap theme
      - brand.scss  # 2. Eigene Farben für feste Bestandteile
    css: styles.scss  # 3. Font



